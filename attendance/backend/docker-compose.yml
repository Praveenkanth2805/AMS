backend:
  build: ./backend
  env_file: ./backend/.env
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
  ports: ["8000:8000"]
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  # No `alembic upgrade head` needed — bootstrap runs on startup.